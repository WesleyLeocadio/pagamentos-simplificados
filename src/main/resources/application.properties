spring.application.name=pagamentos-simplificados

# Configuração da fonte de dados H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Dialeto do Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Criação automática de tabelas (pode ser update, create, create-drop, none)
spring.jpa.hibernate.ddl-auto=update
# Mostrar SQL no console (opcional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ativar console web do H2 (opcional e útil para testes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
